name = "wrapit-gate"
main = "gate.js"
compatibility_date = "2024-11-01"
preview_urls = false

# KV: wrapit-tokens
[[kv_namespaces]]
binding = "TOKENS"
id = "9e4f494e79bc44579e3f8344b11dae16"

# חיבור ישיר ל-Worker של חשבונית ירוקה
[[services]]
binding = "GI"
service = "green-invoice-ofir"

[vars]
GOOGLE_CLIENT_ID = "64711186711-mupvc3dcjbqb35k42ggembit3tppqq48.apps.googleusercontent.com"
FIREBASE_PROJECT_ID = "wrapit-315b2"
ALLOWED_ORIGINS = "https://ofirkarl.github.io"

# סודות (לא בקובץ הזה):
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put ALLOWED_EMAILS   ← המייל שלך (אפשר כמה, מופרדים בפסיק)
#   wrangler secret put MCP_URL      ← כתובת המחבר של חשבונית ירוקה, כמו שהיא מוגדרת ב-claude.ai
